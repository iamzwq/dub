[project]
name = "ytdub"
version = "0.1.0"
description = "下载 YouTube 视频，AI 翻译字幕为中文，edge-tts 配音并用 ffmpeg 合成新视频"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "edge-tts>=7.0",
    "numpy>=1.26",
    "soundfile>=0.12.1",
    "pillow>=10.0",
    "rich>=13.7",
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "yt-dlp[default]>=2025.11.12",
    "httpx>=0.27",
    "jieba>=0.42.1",
]

[project.scripts]
ytdub = "ytdub.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytdub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
